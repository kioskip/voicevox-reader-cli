[project]
name = "vvread"
version = "0.1.0"
description = "Auto-vocalize Claude Code responses via VOICEVOX"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
